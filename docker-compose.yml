# ============================================================================
# حزمة Docker كاملة ومعزولة تماماً عن بيئة التطوير المحلية الحالية (حاوية
# SQL Server اليدوية "sqlserver" المشتركة مع مشاريع أخرى على 1433 — هذه الحزمة
# لا تلمسها ولا تُصدِّر منفذ db للمضيف إطلاقاً، فلا تعارض ممكناً بينهما).
# الاستخدام: انسخ .env.example إلى .env واملأ القيم، ثم:
#   docker compose up --build
# الواجهة على http://localhost:8081 — الهجرات تُطبَّق تلقائياً عند إقلاع الـ API
# (نفس DbSeeder.SeedAsync المستخدَم في التطوير المحلي، انظر Program.cs).
# ============================================================================
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    volumes:
      - souq_db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      # المهلة 10s لا 5s: `sqlcmd` نفسه قِيس عند 8.9s على مضيف يُحاكي x86 (صورة SQL Server
      # لا تصدر إلا linux/amd64، فتعمل تحت Rosetta على أجهزة Apple Silicon) — فكان الفحص
      # يفشل بانتهاء مهلته لا بكون القاعدة ساقطة.
      timeout: 10s
      retries: 10
      # 180s لا 25s: أوّل إقلاع تحت المحاكاة قِيس عند ~5 دقائق حتى يقبل المحرّك اتصالاً
      # (استرجاع master ثمّ تهيئة TLS وQuery Store). بـ 25s كانت نافذة الإقلاع تنتهي قبل أن
      # يبدأ المحرّك أصلاً، فتُستهلك المحاولات العشر ويُعلَن غير سليم — و`depends_on:
      # service_healthy` يُسقط الحزمة كلها: `docker compose up` الموثّق لا ينجح إطلاقاً على
      # جهاز كهذا. الإخفاق داخل نافذة الإقلاع لا يُحتسب ولا يُعلن اعتلالاً، وأوّل نجاح ينهيها
      # فوراً — فالرقم الكبير لا يُبطئ مضيفاً سريعاً، إنّما يمنع حكماً مبكّراً على مضيف بطيء.
      start_period: 180s

  api:
    # الصورة موسومة بنسخة (M18): `docker compose build` يسِمها بهذا الاسم، و`scripts/deploy.sh`
    # ينشر وسماً بعينه ويعود إلى سابقه عند الفشل. بلا وسم كان النشر «ابنِ من المصدر الحاضر»،
    # وهو ما لا يمكن الرجوع عنه لأنّ ما كان يعمل قبل دقيقة لا اسم له.
    image: ${SOUQ_IMAGE_API:-souq-api}:${SOUQ_VERSION:-dev}
    build:
      context: .
      dockerfile: src/Souq.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # اختيارٌ صريح يفرضه التطبيق خارج التطوير (M17، R-18): بلا هذا المفتاح يرفض الـ API الإقلاع.
      # `true` هو الصحيح لهذه الحزمة — نسخة واحدة تُوقَف ثمّ تُشغَّل. `false` يعني خطوة ترحيل متعمّدة
      # قبل الإطلاق، وهو ما يفعله `scripts/deploy.sh --migrate-bundle`. docs/06-DATABASE/Migrations.md §2
      Database__MigrateOnStartup: ${DATABASE_MIGRATE_ON_STARTUP:-true}
      ConnectionStrings__Default: "Server=db,1433;Database=SouqDb;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True"
      # هوية الهجرات (R-12): بلا قيمة تعمل الهجرات بهوية التشغيل نفسها — سلوك هذه الحزمة التجريبية.
      # في نشر حقيقي: طبّق scripts/sql/least-privilege-logins.sql ثم اضبط السلسلتين على souq_app
      # و souq_migrator. هذه الحزمة تُنشئ قاعدتها بنفسها عند أول إقلاع، وهو ما لا تستطيعه هوية
      # مقيَّدة — لذلك تبقى هنا sa عمداً. docs/07-SECURITY/DatabasePrivileges.md
      ConnectionStrings__Migrations: ${DB_MIGRATIONS_CONNECTION:-}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: Souq
      Jwt__Audience: SouqClient
      # بوّابة الدفع: بمفتاح Stripe تعمل Stripe. بلا مفتاح يرفض الـ API الإقلاع (هذه حزمة
      # Production) ما لم يُضبط PAYMENTS_PROVIDER=Fake صراحةً — بوّابة تجريبية تعتبر كل دفع
      # ناجحاً بلا مال: للعرض التوضيحي فقط، لا زبائن حقيقيون (ADR-0020).
      Payments__Provider: ${PAYMENTS_PROVIDER:-}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      # حسابات Stripe خاصة بالمتاجر (المرحلة 11، ADR-0031): مفتاح تشفير مفاتيحها. بلا SECRETS_KEY لا تُربط حسابات متاجر
      # وتقبض كل المتاجر في حساب Stripe أعلاه. مفاتيحها التجريبية مرفوضة ما لم يُسمح بها صراحةً.
      Secrets__ActiveKeyId: ${SECRETS_KEY:+primary}
      Secrets__Keys__primary: ${SECRETS_KEY:-}
      Payments__AllowTestModeStoreAccounts: ${PAYMENTS_ALLOW_TEST_MODE_STORE_ACCOUNTS:-false}
      # البريد (المرحلة 14): ترتيب الأولوية Resend ← Brevo ← Gmail. بلا أي منها يرفض الـ API الإقلاع (هذه حزمة Production)
      # ما لم يُضبط EMAIL_PROVIDER=Log صراحةً — لا تصل حينها أي رسالة (إعادة تعيين، تأكيد، دعوة، تأكيد طلب): للعرض فقط.
      Email__Provider: ${EMAIL_PROVIDER:-}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      # اختياري — بديل Resend، يعمل فقط إن لم يُضبط Resend__ApiKey أعلاه.
      Brevo__ApiKey: ${BREVO_API_KEY:-}
      # اختياري — بديل Resend/Brevo عبر SMTP إن لم يُضبط أيّ منهما أعلاه.
      Gmail__AppPassword: ${GMAIL_APP_PASSWORD:-}
      # عنوان المرسِل (يُستخدم أيضاً لـ Brevo إن لم يُضبط BREVO_SENDER_EMAIL) — بلا افتراضي شخصي.
      Gmail__Username: ${GMAIL_USERNAME:-}
      Brevo__SenderEmail: ${BREVO_SENDER_EMAIL:-}
      # أول مدير في بيئة Production: بلا هذين المتغيّرين لا يُنشأ أي مدير (لا كلمة مرور
      # افتراضية منشورة). كلمة المرور 12 حرفاً على الأقل. احذفهما من .env بعد أول إقلاع.
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      # بيانات العرض (كتالوج المتجر الافتراضي التجريبي ومظهره): لا تُبذَر في هذه الحزمة (Production) إلا بطلب صريح.
      # true للعرض التوضيحي وحده — لا توضع أبداً على قاعدة زبون حقيقي.
      Seed__DemoData: ${SEED_DEMO_DATA:-}
      # تعدّد المتاجر (ADR-0006): المتجر يُحدَّد من المضيف فقط، ولا متجر احتياطي في Production. هذه
      # الحزمة تخدم المتجر الافتراضي على localhost صراحةً (قائمة مفصولة بفواصل)، ومنطقة المنصّة على
      # المضيفين في PLATFORM_HOSTS. النطاقات الحقيقية تُضاف من المنصّة (TenantDomains).
      Seed__DefaultTenantHosts: ${DEFAULT_TENANT_HOSTS:-localhost}
      Tenancy__PlatformHosts__0: ${PLATFORM_HOST:-admin.localhost}
      # مالك المنصّة (بلا متجر، على PLATFORM_HOST): بلا هذين لا يُنشأ. 12 حرفاً على الأقل.
      Seed__PlatformOwnerEmail: ${SEED_PLATFORM_OWNER_EMAIL:-}
      Seed__PlatformOwnerPassword: ${SEED_PLATFORM_OWNER_PASSWORD:-}
      # عنوان العميل الحقيقي من X-Forwarded-For يُصدَّق فقط من وكيل Nginx داخل شبكة Docker (لحدّ
      # المعدّل وروابط البريد). نطاق شبكات Docker الافتراضي؛ اضبطه إن غيّرت شبكة الحزمة.
      ForwardedHeaders__KnownNetworks: ${TRUSTED_PROXY_NETWORKS:-172.16.0.0/12}
      # بعض مزوّدي الإنترنت يحجبون المنفذ 587 (STARTTLS) — عندها استخدم 465
      # (TLS ضمني) عبر GMAIL_SMTP_PORT في .env؛ الافتراضي يبقى 587 القياسي.
      Gmail__Port: ${GMAIL_SMTP_PORT:-587}
      # رابط الواجهة داخل رسائل إعادة التعيين. 8081 هو المنفذ المنشور للواجهة. لتجربة
      # الرابط من هاتف على نفس الشبكة اضبط FRONTEND_URL في .env على عنوان جهازك.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - souq_uploads:/app/wwwroot/uploads
    ports:
      - "5201:8080"   # وصول مباشر اختياري للـ API/Swagger أثناء التشخيص

  web:
    image: ${SOUQ_IMAGE_WEB:-souq-web}:${SOUQ_VERSION:-dev}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # الجاهزية لا مجرّد الإقلاع: الـ API يطبّق الهجرات ويبذر قبل أن يخدم أي طلب، وبلا هذا
    # الشرط يبدأ الوكيل بإرجاع 502 للزائر الأول. الفحص مُعرَّف في src/Souq.API/Dockerfile.
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  souq_db_data:
  souq_uploads:
