# توكيل عكسي داخل شبكة Docker Compose نحو حاوية الـ API (اسم الخدمة "api").
# نفس تقسيم vite.config.js في التطوير (/api و/uploads) لكن لبيئة الإنتاج.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
    }

    # تطبيق صفحة واحدة (SPA): أي مسار غير موجود كملف ساكن يعود لـ index.html
    # كي يتولّى react-router التوجيه من جهة العميل.
    location / {
        try_files $uri /index.html;
    }
}
