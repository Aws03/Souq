# ============================================================================
# مخطّط الطلب الأصلي (R-16). nginx هنا يستمع على 80، فـ $scheme دائماً "http": خلف مُنهٍ
# TLS خارجي كان الـ API يظنّ نفسه على http فلا يُرسل HSTS أبداً، وتخرج روابط البريد بـ
# http://. نحترم X-Forwarded-Proto القادم إن وُجد، وإلا نستخدم مخطّطنا.
#   تحذير نشر: هذا صحيح حين يكون أمام nginx وكيلٌ موثوق. إن كان nginx نفسه هو الحافة
#   المكشوفة للإنترنت فامسح هذا الـ map واستخدم $scheme مباشرةً — وإلا صدّقت ترويسة عميل.
# map يعيش في سياق http: هذا الملف يُنسخ إلى conf.d فيُضمَّن هناك.
# ============================================================================
map $http_x_forwarded_proto $souq_forwarded_proto {
    default $scheme;
    "~^https?$" $http_x_forwarded_proto;
}

# توكيل عكسي داخل شبكة Docker Compose نحو حاوية الـ API (اسم الخدمة "api").
# نفس تقسيم vite.config.js في التطوير (/api و/uploads) لكن لبيئة الإنتاج.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $http_host;   # مع المنفذ: روابط البريد تُبنى من مضيف الطلب
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $souq_forwarded_proto;
        # حدّ حجم جسم الطلب الافتراضي في nginx هو 1MB فقط — يرفض رفع الفيديو
        # (حتى 50MB) والصور (حتى 5MB) بـ 413 قبل وصولها للـ API أصلاً. نرفعه
        # ليطابق أقصى حدّ في الـ API (فيديو 55MB، RequestSizeLimit في ProductsController).
        client_max_body_size 55m;
    }

    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
        # المتجر يُحدَّد من المضيف وحده (ADR-0006)، ووسيط التحديد يعمل على /uploads أيضاً — وملفات المتجر لا تُخدَم إلا على
        # مضيفه. بلا تمرير المضيف الأصلي يضع nginx مضيف الوجهة ("api:8080")، فلا متجر على هذا المضيف ⇒ 404 StoreNotFound
        # لكل صورة منتج وشعار متجر في الحزمة. نفس ترويسات /api/ بالضبط (F-24).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $souq_forwarded_proto;
    }

    # تطبيق صفحة واحدة (SPA): أي مسار غير موجود كملف ساكن يعود لـ index.html
    # كي يتولّى react-router التوجيه من جهة العميل.
    location / {
        # ترويسات أمان الصفحة نفسها (R-16). هنا فقط لا على مستوى الخادم: /api و/uploads
        # تأتيان من الـ API الذي يضبط ترويساته بنفسه، وإضافتها هنا تُنتج ترويسات مكرّرة —
        # والمتصفّح يقاطع سياستَي CSP فتصير أشدّ مما قصد أيٌّ منهما.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), usb=()" always;

        # سياسة المحتوى للواجهة — بوضع الإبلاغ فقط (Report-Only) عن قصد.
        # الأصول الخارجية مُستخرَجة من الشيفرة: خطوط جوجل يحقنها storeTheme.js برابط لكل متجر
        # (tenantModel.js)، وStripe يحقن js.stripe.com وإطاراته عند الدفع. لكن سلوك زمن التشغيل
        # (أنماط مضمّنة يحقنها Stripe Elements، استيراد ديناميكي) لا يُثبَت إلا بجلسة متصفّح
        # حقيقية، وسياسة مفروضة بلا ذلك تكسر متجراً بصمت عند الدفع تحديداً — أسوأ مكان ممكن.
        # لتفعيلها: افتح المتجر والدفع مرّة، تأكّد أن وحدة التحكّم خالية من مخالفات، ثم غيّر
        # الاسم إلى Content-Security-Policy. docs/07-SECURITY/Security.md §4.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        try_files $uri /index.html;
    }
}
