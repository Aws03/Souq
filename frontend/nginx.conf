# توكيل عكسي داخل شبكة Docker Compose نحو حاوية الـ API (اسم الخدمة "api").
# نفس تقسيم vite.config.js في التطوير (/api و/uploads) لكن لبيئة الإنتاج.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $http_host;   # مع المنفذ: روابط البريد تُبنى من مضيف الطلب
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # حدّ حجم جسم الطلب الافتراضي في nginx هو 1MB فقط — يرفض رفع الفيديو
        # (حتى 50MB) والصور (حتى 5MB) بـ 413 قبل وصولها للـ API أصلاً. نرفعه
        # ليطابق أقصى حدّ في الـ API (فيديو 55MB، RequestSizeLimit في ProductsController).
        client_max_body_size 55m;
    }

    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
        # المتجر يُحدَّد من المضيف وحده (ADR-0006)، ووسيط التحديد يعمل على /uploads أيضاً — وملفات المتجر لا تُخدَم إلا على
        # مضيفه. بلا تمرير المضيف الأصلي يضع nginx مضيف الوجهة ("api:8080")، فلا متجر على هذا المضيف ⇒ 404 StoreNotFound
        # لكل صورة منتج وشعار متجر في الحزمة. نفس ترويسات /api/ بالضبط (R-13).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # تطبيق صفحة واحدة (SPA): أي مسار غير موجود كملف ساكن يعود لـ index.html
    # كي يتولّى react-router التوجيه من جهة العميل.
    location / {
        try_files $uri /index.html;
    }
}
