# ============================================================================
# إعداد فحص الأسرار (CI). الافتراضيات كلها مفعّلة، وما دونها استثناءات مُعلَّلة.
#
# المبدأ: قاعدة generic-api-key تشتعل على كل ما يشبه إسناد سرّ — بما فيه كلمات مرور
# اختبارية مثل "Intruder-Pass-1" ومفاتيح Stripe النائبة (sk_test_51Habc). فحص يصرخ
# تسع عشرة مرّة على ملفات اختبار هو فحص سيُطفأ بعد أسبوع، فيصبح أسوأ من غيابه.
#
# لكن استثناء مسارات الاختبار وحده كان سيخفي ما تمنعه المهمّة صراحةً: اعتماد إنتاج
# حقيقي داخل اختبار. لذلك يقابل هذا الاستثناءَ فحصٌ مستقلّ في .github/workflows/ci.yml
# يبحث عن مفاتيح Stripe الحيّة في *كل* المستودع، الاختبارات ضمنه، ولا يمكن استثناؤه هنا.
# ============================================================================
title = "Souq secret scan"

[extend]
useDefault = true

[allowlist]
description = "بيانات اختبار ونصوص واجهة — لا أسرار حقيقية"
paths = [
    # مشاريع الاختبار: كلمات مرور ورموز مُصطنعة بحكم تعريفها.
    '''(^|/)tests/''',
    '''\.test\.js$''',
    # ملفات الترجمة تشرح للمستخدم شكل مفاتيح Stripe ("يبدأ بـ pk_live_…") ولا تحوي مفتاحاً.
    '''(^|/)frontend/src/i18n/locales/''',
]
regexes = [
    # المفاتيح النائبة المستخدمة في الأمثلة والاختبارات — قصيرة بوضوح (مفتاح Stripe
    # الحقيقي نحو 99 محرفاً)، فلا تشبه سرّاً حقيقياً بأي مقياس.
    '''(sk|pk|rk)_(test|live)_51Habc''',
]
